<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Residents · Cat Planet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Noto+Serif+SC:wght@500;700&family=Noto+Sans+SC:wght@400;500;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/site.css" />
  </head>
  <body>
    <header id="siteHeader" class="site-header"></header>

    <main class="sheet" style="margin-top: 32px">
      <h2><span data-lang="en">Residents</span><span data-lang="zh">居民</span></h2>
      <p class="lead">
        <span data-lang="en">Visit their homes and stories. Only the owner can play with their cat; anyone can light a lantern.</span>
        <span data-lang="zh">去它们家看看，读读它们的故事。只有主人能和自己的猫互动，谁都可以来点一盏灯。</span>
      </p>
      <p class="street-links"><a href="/"><span data-lang="en">← Back to town</span><span data-lang="zh">← 回喵城镇</span></a></p>
      <div id="grid" class="cat-grid"></div>
    </main>

    <footer></footer>

    <script type="module">
      import { allCats, cardHtml, ensureAuth, renderHeader } from '/src/site/store.js';
      await ensureAuth();
      renderHeader();
      document.getElementById('grid').innerHTML = allCats().map(cardHtml).join('');
    </script>
  </body>
</html>
