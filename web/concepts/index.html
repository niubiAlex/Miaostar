<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8" />
<title>猫星小屋 · 四版概念图</title>
<style>
  body { margin: 24px; background: #fef7e5; color: #5b4636; font-family: -apple-system, 'PingFang SC', sans-serif; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 20px; }
  figure { margin: 0; }
  img { width: 100%; border-radius: 12px; }

<h1>猫星上猫猫的家：四版概念图</h1>
<div class="grid">
  <figure><img src="planet.png" alt="" /><figcaption>A 猫星幻想：圆窗外有带环的月亮和猫耳山，爪印形的门，鱼形灯，星星墙纸</figcaption></figure>
  <figure><img src="cottage.png" alt="" /><figcaption>B 阳光小屋：带垫子的飘窗、小猫爬架、爪印踏板、毛线筐、鱼形门垫</figcaption></figure>
  <figure><img src="free.png" alt="" /><figcaption>C 自由发挥：猫爬架、墙上的猫洞、小壁炉、流水饮水台，东西最多</figcaption></figure>
  <figure><img src="burrow.png" alt="" /><figcaption>D 树洞：吊床、猫草、羽毛玩具，圆门外是长蘑菇的花园</figcaption></figure>
</div>
