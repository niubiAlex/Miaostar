<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Send a cat · Cat Planet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Noto+Serif+SC:wght@500;700&family=Noto+Sans+SC:wght@400;500;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/site.css" />
  </head>
  <body>
    <header id="siteHeader" class="site-header"></header>

    <main class="sheet" style="margin-top: 32px">
      <h2>Send a cat to Cat Planet</h2>
      <p class="lead">Free. Leave photos and a story first. Home animation will follow — we will update the page when it is ready.</p>

      <div id="loginGate" class="login-gate">
        <p>Please log in first — so we know which cats are yours.</p>
        <div class="actions">
          <button type="button" class="button" id="gateLogin">Log in</button>
          <button type="button" class="button ghost" id="gateSignup">Sign up</button>
        </div>
      </div>

      <form id="form" class="form" novalidate hidden>
        <label>
          <span>Photos (1–5)</span>
          <input type="file" name="photos" accept="image/*" multiple />
          <span class="hint">Front, side, and full body if you can. Photos stay in your browser for now when previewing.</span>
          <div id="photoPreview" class="photos"></div>
        </label>

        <div class="row">
          <label><span>Cat’s name</span><input name="name" maxlength="12" placeholder="e.g. Xiaowu" /></label>
          <label><span>Your name</span><input name="owner" maxlength="32" readonly /></label>
        </div>

        <label>
          <span>Homepage address</span>
          <div class="slug-input"><span>catplanet.online/</span><input name="slug" maxlength="24" placeholder="xiaowu" /></div>
          <span class="hint" id="slugStatus">Suggested from the name — change it if you like. If taken, we will tell you.</span>
        </label>

        <div class="row">
          <label><span>Birthday (optional)</span><input type="date" name="birthday" /></label>
          <label><span>Came home (optional)</span><input type="date" name="homeDay" /></label>
          <label><span>Arrived on Cat Planet</span><input type="date" name="planetDay" /></label>
        </div>

        <label><span>Coat (optional)</span><input name="coat" maxlength="20" placeholder="e.g. calico, orange tabby" /></label>

        <label>
          <span>What you want to say</span>
          <textarea name="story" rows="6" maxlength="2000" placeholder="How you met, little habits, what you miss…"></textarea>
          <span class="hint">Blank line starts a new paragraph.</span>
        </label>

        <p class="hint">By submitting you agree to the <a href="/terms">Terms</a> and <a href="/privacy">Privacy</a> notes.</p>
        <p id="error" class="error" hidden></p>
        <button type="submit" class="button">Send to Cat Planet</button>
      </form>
    </main>

    <footer></footer>
    <script type="module" src="/src/site/new-page.js"></script>
  </body>
</html>
